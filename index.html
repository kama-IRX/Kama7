<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель пользователя</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="page">
    <section class="user-panel">
      <div class="user-panel__avatar-wrapper">
        <img class="user-panel__avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=kama" alt="Аватар пользователя" width="56" height="56">
        <span class="user-panel__status-dot"></span>
      </div>

      <div class="user-panel__info">
        <div class="user-panel__header">
          <h1 class="user-panel__name">Алексей Смирнов</h1>
          <span class="user-panel__status">В сети</span>
        </div>
        <p class="user-panel__role">Frontend-разработчик</p>
      </div>

      <button class="user-panel__btn" type="button">Написать</button>
    </section>
  </main>

</body>
</html>
